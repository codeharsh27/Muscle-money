services:
  postgres:
    image: postgres:16-alpine
    container_name: muscle-money-postgres
    environment:
      POSTGRES_USER: muscle_money
      POSTGRES_PASSWORD: muscle_money
      POSTGRES_DB: muscle_money
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muscle_money -d muscle_money"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muscle-money-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
